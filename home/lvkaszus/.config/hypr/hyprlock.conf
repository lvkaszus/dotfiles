general {
    hide_cursor = true
    ignore_empty_input = true   # do not validate an empty password
}

background {
    monitor =
    path = ~/Pictures/Wallpaper.jpg
    color = rgb(121212)    # fallback until the image is loaded
    blur_passes = 2        # 0 = sharp wallpaper
    blur_size = 7
    brightness = 0.7       # slightly dimmed so the clock and input stay readable
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(4dd2ff)
    inner_color = rgb(121212)
    font_color = rgb(ffffff)
    font_family = JetBrains Mono
    check_color = rgb(e066ff)
    fail_color = rgb(df3320)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(4dd2ff)
    font_size = 90
    font_family = JetBrains Mono
    position = 0, 120
    halign = center
    valign = center
}
