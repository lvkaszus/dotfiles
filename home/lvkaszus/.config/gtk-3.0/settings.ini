# GTK 3 settings, read by GTK3 apps at startup.
# GTK 4 apps read the same values from gsettings (set in hyprland.lua).
[Settings]
# GTK theme: adw-gtk3, dark variant.
# Colors are customized in ~/.config/gtk-3.0/gtk.css.
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
# Icon theme (Tela is installed manually into ~/.local/share/icons, see README)
gtk-icon-theme-name=Tela-dark
