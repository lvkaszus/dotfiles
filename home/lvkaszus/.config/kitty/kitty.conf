# Font
font_family JetBrains Mono

# Transparency and blur of the content behind the window
background_opacity 0.8
background_blur 32
# Allow changing the opacity at runtime (see "Window opacity" in the kitty docs)
dynamic_background_opacity yes

# Colors (same palette as waybar)
foreground #fcfcfc
background #121212
cursor #e066ff
selection_background #8a3fb8
selection_foreground #fcfcfc
url_color #4dd2ff

# Terminal bell
enable_audio_bell no
